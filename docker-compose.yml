x-backend-env: &backend-env
  APP_ENV: local
  APP_DEBUG: "true"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: fx_pulse
  DB_USERNAME: fx_pulse
  DB_PASSWORD: secret
  CACHE_STORE: redis
  QUEUE_CONNECTION: database
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: fxpulse
  REVERB_APP_KEY: local-key
  REVERB_APP_SECRET: local-secret
  # Server-side broadcaster reaches Reverb by its service name inside the network.
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"
  EXCHANGE_STREAM_INTERVAL: "10"

services:
  app:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment: *backend-env
    depends_on:
      - db
      - redis

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  worker:
    build: ./backend
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=1
    volumes:
      - ./backend:/var/www/html
    environment: *backend-env
    depends_on:
      - app

  poller:
    build: ./backend
    restart: unless-stopped
    command: php artisan fx:stream
    volumes:
      - ./backend:/var/www/html
    environment: *backend-env
    depends_on:
      - app

  reverb:
    build: ./backend
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    environment: *backend-env
    depends_on:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_REVERB_APP_KEY: local-key
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: "8080"
        VITE_REVERB_SCHEME: http
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - web

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fx_pulse
      MYSQL_USER: fx_pulse
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  db-data:
